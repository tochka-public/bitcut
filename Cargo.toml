[package]
name = "bitcut"
version = "1.0.0"
edition = "2021"
description = "Create and apply binary patches"
license = "MIT"
repository = "https://github.com/tochka-public/bitcut"
readme = "README.md"
categories = ["command-line-utilities", "compression"]
keywords = ["binary", "bin", "diff", "patch"]
exclude = ["/.github", "/target", "/fuzz"]

[workspace]
members = []
exclude = ["fuzz"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "bitcut"
required-features = ["cli"]
path = "src/main.rs"

[dependencies]
rustc-hash = "2.1"

[dependencies.clap]
version = "4.5"
features = ["derive"]
optional = true

[dependencies.anyhow]
version = "1.0"
optional = true

[features]
default = ["cli"]
cli = ["clap", "anyhow"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rstest = "0"
proptest = "1"
insta = "1.47.2"

[[bench]]
name = "my_benchmark"
harness = false

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"
as_conversions = "deny"
default_numeric_fallback = "deny"
